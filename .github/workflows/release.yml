name: release

on:
  push:
    tags:
      - 'v*'
  # Releases the commit it runs on under a new tag, for when there is no
  # machine at hand to push one from.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.1.28'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows binaries
        env:
          CGO_ENABLED: 0
          GOOS: windows
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/upgaming/roaster/internal/version.Version=${TAG}" \
              -o dist/roaster-windows-$arch.exe ./cmd/roaster
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -H windowsgui -X github.com/upgaming/roaster/internal/version.Version=${TAG}" \
              -o dist/kiosk-windows-$arch.exe ./cmd/kiosk
          done

      - name: Checksum
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --generate-notes --target "$GITHUB_SHA"
