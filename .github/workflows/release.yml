name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows binaries
        env:
          CGO_ENABLED: 0
          GOOS: windows
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/upgaming/roaster/internal/version.Version=${GITHUB_REF_NAME}" \
              -o dist/roaster-windows-$arch.exe ./cmd/roaster
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -H windowsgui -X github.com/upgaming/roaster/internal/version.Version=${GITHUB_REF_NAME}" \
              -o dist/kiosk-windows-$arch.exe ./cmd/kiosk
          done

      - name: Checksum
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
