name: release

on:
  push:
    tags:
      - 'v*'
  # Releases the commit it runs on under a new tag, for when there is no
  # machine at hand to push one from.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.1.28'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build Windows binaries
        env:
          CGO_ENABLED: 0
          GOOS: windows
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/upgaming/roaster/internal/version.Version=${TAG}" \
              -o dist/roaster-windows-$arch.exe ./cmd/roaster
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -H windowsgui -X github.com/upgaming/roaster/internal/version.Version=${TAG}" \
              -o dist/kiosk-windows-$arch.exe ./cmd/kiosk
          done

      - name: Checksum
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS

      # Stands refuse an update whose SHA256SUMS is not signed by this key.
      # UPDATE_SIGNING_KEY is an ed25519 private key in PEM form, made with
      # "openssl genpkey -algorithm ed25519". Its public half goes in
      # signingPublicKey in internal/update/update.go, as base64 of the raw 32
      # bytes: openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | base64
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "UPDATE_SIGNING_KEY is not set"; exit 1; }
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --generate-notes --target "$GITHUB_SHA"
