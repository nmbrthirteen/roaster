<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{.Kiosk.Headline}}</title>
<style>
  /* The lifeat stack, served from the binary so a kiosk with no network still
     renders on brand. Integral CF for headings, Sora for body copy, Roboto as
     the default, Anonymous Pro for buttons. */
  @font-face { font-family: Integral; src: url(/fonts/integral-bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: Integral; src: url(/fonts/integral-heavy.woff2) format("woff2"); font-weight: 900; font-display: swap; }
  @font-face { font-family: Roboto; src: url(/fonts/roboto-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Roboto; src: url(/fonts/roboto-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: Sora; src: url(/fonts/sora-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Sora; src: url(/fonts/sora-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Anonymous Pro"; src: url(/fonts/anonymous-pro-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Anonymous Pro"; src: url(/fonts/anonymous-pro-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }

  :root {
    /* Straight from the lifeat palette. */
    --black: #070707;
    --white: #fffbf8;
    --surface: #0d0d0d;
    --elevated: #1a1a1a;
    --border: #27272a;
    --muted: #a1a1aa;
    --subtle: #71717a;
    --primary: #0fff50;
    --secondary: #6662ff;
    --blue: #5c8ef0;

    --display: Integral, system-ui, sans-serif;
    --sans: Roboto, system-ui, sans-serif;
    --sora: Sora, system-ui, sans-serif;
    --mono: "Anonymous Pro", Consolas, Monaco, ui-monospace, monospace;

    /* lifeat's entrance curve and stagger, from globals.css. */
    --ease: cubic-bezier(.45, 0, .15, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white); font-family: var(--sans);
    display: grid; place-items: center; overflow: hidden;
    padding: clamp(24px, 6vw, 72px);
  }

  /* The GridLines background from lifeat: four horizontal rules at quarters,
     six vertical at fifths, in #80808033. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to bottom, #80808033 1px, transparent 1px),
      linear-gradient(to right, #80808033 1px, transparent 1px);
    background-size: 100% 25%, 20% 100%;
    background-position: 0 0, 0 0;
  }

  .screen { display: none; position: relative; z-index: 1; width: min(100%, 700px); text-align: center; }
  .screen[data-active] { display: block; }
  .screen[data-active] > * { animation: fade-up .85s var(--ease) both; }
  .screen[data-active] > *:nth-child(2) { animation-delay: .08s; }
  .screen[data-active] > *:nth-child(3) { animation-delay: .16s; }
  .screen[data-active] > *:nth-child(4) { animation-delay: .24s; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } }

  .mark { display: block; width: 54px; height: 62px; margin: 0 auto clamp(26px, 4.6vh, 48px); }
  .mark path { fill: var(--primary); }

  /* Headings across lifeat are Integral CF, uppercase, at 120% leading. */
  h1 {
    font-family: var(--display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(30px, 5.6vw, 60px); line-height: 1.2; letter-spacing: 0;
    margin: 0;
  }
  .lede {
    font-family: var(--sora); font-size: clamp(14px, 1.8vw, 18px); line-height: 1.4;
    color: var(--white); max-width: 34ch; margin: 18px auto 0;
  }

  form { display: flex; gap: 12px; align-items: stretch; margin-top: clamp(32px, 6vh, 60px); }
  input {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: clamp(20px, 3.4vw, 30px);
    color: var(--white); background: var(--elevated); border: 1px solid var(--border);
    border-radius: 999px; padding: clamp(16px, 2.6vh, 24px) 28px; text-align: center;
  }
  input::placeholder { color: var(--subtle); }
  input:focus { outline: none; border-color: var(--primary); }

  /* The secondary variant the hero CTA uses: violet, square, mono, italic
     until hover. */
  button {
    font-family: var(--mono); font-weight: 600; font-style: italic; cursor: pointer;
    background: var(--secondary); color: var(--white); border: 0; border-radius: 0;
    transition: opacity .3s var(--ease), background .3s var(--ease);
  }
  button:hover:not(:disabled) { font-style: normal; }
  button:disabled { background: var(--elevated); color: var(--subtle); cursor: not-allowed; }
  button:active:not(:disabled) { opacity: .8; }
  #go { font-size: clamp(22px, 3.6vw, 30px); font-style: normal; border-radius: 999px; padding: 0 clamp(26px, 3.8vw, 36px); }
  .wide { width: 100%; font-size: clamp(17px, 2.6vw, 21px); border-radius: 999px; padding: clamp(16px, 2.8vh, 24px); }

  .rows { display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 22px); text-align: left; }
  .row { animation: rise .4s var(--ease) both; }
  .row-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-family: var(--mono); font-size: clamp(14px, 2.1vw, 18px);
  }
  .row-top b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-top span:first-child { font-family: var(--sans); }
  .row-tag { color: var(--primary); }
  .track { height: 8px; border-radius: 0; background: var(--elevated); margin-top: 10px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--blue)); border-radius: 0; width: 0; transition: width .9s var(--ease); }

  .verdict { font-family: var(--sora); font-size: clamp(17px, 2.5vw, 23px); line-height: 1.4; margin: 0; }
  .step { font-family: var(--mono); font-size: 14px; color: var(--subtle); margin: clamp(24px, 4vh, 40px) 0 0; }

  .score {
    font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(60px, 14vw, 124px);
    line-height: 1.05; letter-spacing: 0;
  }
  /* lifeat's text-gradient: green into blue. */
  .score .num {
    background: linear-gradient(90deg, var(--primary) 0%, var(--blue) 100%);
    background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .score small {
    display: block; font-family: var(--mono); font-size: clamp(13px, 1.9vw, 17px);
    font-weight: 400; color: var(--primary); text-transform: none; margin-top: 18px;
  }
  .note { font-family: var(--mono); font-size: 14px; color: var(--subtle); margin: 16px 0 0; min-height: 1.3em; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="logo" viewBox="0 0 28 32">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.01829 22.8968L5.52309 23.8597C5.64693 23.9369 5.7885 23.9792 5.93346 23.9823C6.07841 23.9854 6.2216 23.9493 6.3485 23.8775C6.4754 23.8056 6.5815 23.7007 6.65605 23.5734C6.73059 23.446 6.77094 23.3008 6.77298 23.1523V12.4379C6.77357 12.2912 6.81156 12.1472 6.88319 12.0202C6.95483 11.8932 7.05762 11.7875 7.18139 11.7137L20.297 4L23.6986 6.00983L10.5473 13.7544C10.4245 13.8283 10.3225 13.9337 10.2514 14.0602C10.1802 14.1866 10.1424 14.3299 10.1417 14.4758V29.9958L0.548198 24.3228C0.382491 24.2248 0.244705 24.0842 0.148534 23.9148C0.0523625 23.7454 0.00115491 23.5531 0 23.3572V8.48C0.00058687 8.33331 0.0385783 8.18933 0.110212 8.06231C0.181846 7.93528 0.284637 7.82962 0.408407 7.75579L13.5295 0L16.9311 2.00982L3.79079 9.71228C3.66611 9.786 3.56251 9.89195 3.49036 10.0195C3.41821 10.1471 3.38003 10.2919 3.37964 10.4393V21.7151C3.38044 21.9512 3.43939 22.1832 3.55102 22.3898C3.66266 22.5964 3.82337 22.7708 4.01829 22.8968Z"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M23.5862 17.965L20.1133 19.9945C19.9472 20.0927 19.8092 20.2338 19.713 20.4037C19.6168 20.5737 19.5658 20.7665 19.5651 20.9629V24.306L26.5136 20.2303C26.6793 20.1323 26.817 19.9916 26.9132 19.8222C27.0094 19.6528 27.0606 19.4606 27.0618 19.2646V9.44008C27.0598 9.29433 27.021 9.15158 26.949 9.02581C26.8771 8.90003 26.7745 8.79554 26.6513 8.72255C26.5281 8.64956 26.3885 8.61057 26.2461 8.6094C26.1038 8.60823 25.9636 8.64492 25.8393 8.71587L13.9434 15.7025C13.8196 15.7764 13.7168 15.882 13.6452 16.0091C13.5736 16.1361 13.5356 16.2801 13.535 16.4267V32.0001L16.2047 30.4225C16.3704 30.3246 16.5082 30.1839 16.6044 30.0145C16.7005 29.8451 16.7517 29.6529 16.7529 29.4569V18.6303C16.7532 18.4838 16.7908 18.34 16.8619 18.213C16.9331 18.086 17.0353 17.9802 17.1586 17.906L24.011 13.8387V17.2267C24.0112 17.3775 23.9719 17.5255 23.8972 17.6553C23.8224 17.7852 23.715 17.8921 23.5862 17.965Z"/>
  </symbol>
</svg>

<section class="screen" id="entry" data-active>
  <svg class="mark"><use href="#logo"/></svg>
  <h1>{{.Kiosk.Headline}}</h1>
  <p class="lede">{{.Kiosk.Subhead}}</p>
  <form id="form">
    <input id="handle" placeholder="torvalds" autocomplete="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="go" maxlength="39" autofocus>
    <button type="submit" id="go" disabled aria-label="Start">&rarr;</button>
  </form>
</section>

<section class="screen" id="audit">
  <svg class="mark"><use href="#logo"/></svg>
  <div class="rows" id="rows"></div>
  <p class="step" id="step">Reading public commits</p>
</section>

<section class="screen" id="result">
  <svg class="mark"><use href="#logo"/></svg>
  <div class="score"><span class="num" id="score">89 / 100</span><small id="scoreTag"></small></div>
  <p class="verdict" id="finalVerdict" style="margin-top:clamp(24px,4vh,40px)"></p>
  <button class="wide" id="print" style="margin-top:clamp(28px,5vh,48px)">Print my receipt</button>
  <p class="note" id="note"></p>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screens = ['entry', 'audit', 'result'];
  let current = 'entry', idleTimer = null, roast = null;

  function show(name) {
    screens.forEach(s => $(s).toggleAttribute('data-active', s === name));
    current = name;
    if (name === 'entry') $('handle').focus();
    resetIdleTimer();
  }

  // Someone who walks away must not hold the terminal.
  function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (current === 'entry' && !$('handle').value) return;
    idleTimer = setTimeout(reset, current === 'result' ? 60000 : 45000);
  }
  function reset() {
    $('handle').value = '';
    $('go').disabled = true;
    $('rows').innerHTML = '';
    $('note').textContent = '';
    show('entry');
  }
  ['pointerdown', 'keydown'].forEach(e => document.addEventListener(e, resetIdleTimer));

  // Only what a GitHub username can hold, so a typo cannot become a bad request.
  $('handle').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^A-Za-z0-9-]/g, '');
    $('go').disabled = e.target.value.length === 0;
  });

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    if ($('handle').value) start($('handle').value);
  });

  // Each update paints as it lands, so the wait shows real progress rather
  // than a spinner that tells nobody anything.
  function start(handle) {
    $('rows').innerHTML = '';
    $('step').textContent = 'Reading public commits';
    show('audit');

    const src = new EventSource('/api/roast?handle=' + encodeURIComponent(handle)
      + location.search.replace('?', '&'));

    src.onmessage = e => {
      const u = JSON.parse(e.data);
      if (u.phase === 'fetch') $('step').textContent = u.label;
      if (u.phase === 'metric') addMetric(u.metric);
      if (u.phase === 'verdict') u.verdict ? typeVerdict(u.verdict) : ($('step').textContent = u.label);
      if (u.phase === 'done') { roast = u.roast; src.close(); finish(); }
      if (u.phase === 'error') fail(src, u.error);
      resetIdleTimer();
    };
    src.onerror = () => fail(src, 'Could not reach the audit.');
  }

  function fail(src, message) {
    src.close();
    $('step').textContent = message;
    setTimeout(reset, 4000);
  }

  function addMetric(m) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="row-top">
        <span></span>
        <span><b></b>${m.tag ? ' <span class="row-tag"></span>' : ''}</span>
      </div>
      ${m.percent != null ? '<div class="track"><div class="fill"></div></div>' : ''}`;
    row.querySelector('.row-top span').textContent = m.label;
    if (m.tag) row.querySelector('.row-tag').textContent = m.tag;
    const value = row.querySelector('b');
    $('rows').append(row);

    if (m.percent == null) { value.textContent = m.value; return; }
    value.textContent = '0%';
    requestAnimationFrame(() => {
      row.querySelector('.fill').style.width = m.percent + '%';
      countTo(value, m.percent, m.value);
    });
  }

  function countTo(el, target, finalText) {
    const started = performance.now(), ms = 900;
    const tick = now => {
      const t = Math.min(1, (now - started) / ms);
      el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3))) + '%';
      if (t < 1) requestAnimationFrame(tick); else el.textContent = finalText;
    };
    requestAnimationFrame(tick);
  }

  function typeVerdict(text) {
    $('step').textContent = 'Writing the verdict';
    const p = document.createElement('p');
    p.className = 'verdict';
    $('rows').append(p);
    let i = 0;
    const tick = () => {
      p.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(tick, 16);
    };
    tick();
  }

  function finish() {
    $('score').textContent = roast.score;
    $('scoreTag').textContent = 'roast severity: ' + roast.scoreTag;
    $('finalVerdict').textContent = '“' + roast.verdict + '”';
    $('print').disabled = false;
    $('print').textContent = 'Print my receipt';
    $('note').textContent = '';
    show('result');
  }

  // Web Serial writes straight from this page, which is what lets the kiosk be
  // a hosted URL with nothing installed on the device.
  const serial = {
    port: null,
    async restore() {
      if (!('serial' in navigator)) return;
      const [granted] = await navigator.serial.getPorts();
      if (!granted) return;
      await granted.open({ baudRate: 115200 });
      this.port = granted;
    },
    async write(bytes) {
      const writer = this.port.writable.getWriter();
      try {
        for (let i = 0; i < bytes.length; i += 64) await writer.write(bytes.subarray(i, i + 64));
      } finally { writer.releaseLock(); }
    },
  };
  serial.restore().catch(() => {});

  $('print').addEventListener('click', async e => {
    e.target.disabled = true;
    e.target.textContent = 'Printing';
    try {
      if (serial.port) {
        const res = await fetch('/receipt.bin?code=' + roast.code + location.search.replace('?', '&'));
        await serial.write(new Uint8Array(await res.arrayBuffer()));
      } else {
        const res = await fetch('/receipt/print', {
          method: 'POST',
          body: new URLSearchParams({ code: roast.code }),
        });
        if (!res.ok) throw new Error(await res.text());
      }
      e.target.textContent = 'Take your receipt';
      $('note').textContent = 'Scan the code for the digital version.';
      setTimeout(reset, 8000);
    } catch (err) {
      e.target.disabled = false;
      e.target.textContent = 'Try again';
      $('note').textContent = err.message || String(err);
    }
  });

  // ?screen=audit or ?screen=result jumps straight to a state with example
  // content. Reviewing the wait and the result should not mean typing a name
  // and waiting six seconds every time.
  const preview = new URLSearchParams(location.search).get('screen');
  if (preview === 'audit' || preview === 'result') {
    fetch('/api/example' + location.search).then(r => r.json()).then(r => {
      roast = r;
      if (preview === 'result') return finish();
      show('audit');
      r.metrics.forEach(addMetric);
      typeVerdict(r.verdict);
    });
  } else {
    show('entry');
  }
})();
</script>
</body>
</html>
