<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>{{.Headline}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#070707">
<link rel="icon" href="/assets/icon-192.png">
<style>
  /* Served from the binary so a kiosk with no network still renders on brand. */
  @font-face { font-family: Integral; src: url(/fonts/integral-bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: Integral; src: url(/fonts/integral-heavy.woff2) format("woff2"); font-weight: 900; font-display: swap; }
  @font-face { font-family: Roboto; src: url(/fonts/roboto-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Roboto; src: url(/fonts/roboto-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: Sora; src: url(/fonts/sora-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Sora; src: url(/fonts/sora-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Anonymous Pro"; src: url(/fonts/anonymous-pro-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Anonymous Pro"; src: url(/fonts/anonymous-pro-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }

  :root {
    /* Straight from the lifeat palette. */
    --black: #070707;
    --white: #fffbf8;
    --surface: #0d0d0d;
    --elevated: #1a1a1a;
    --border: #27272a;
    --muted: #a1a1aa;
    --subtle: #71717a;
    --primary: #0fff50;
    --secondary: #6662ff;

    --display: Integral, system-ui, sans-serif;
    --sans: Roboto, system-ui, sans-serif;
    --sora: Sora, system-ui, sans-serif;
    --mono: "Anonymous Pro", Consolas, Monaco, ui-monospace, monospace;

    /* lifeat's entrance curve. */
    --ease: cubic-bezier(.45, 0, .15, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Scrolling is allowed, pinching is not: a zoomed stand has no way back. */
  html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: pan-x pan-y; }
  body {
    background: var(--black); color: var(--white); font-family: var(--sans);
    display: grid; place-items: center; overflow: hidden;
    padding: clamp(20px, 3vw, 40px);
  }

  /* GridLines: four horizontal rules at quarters, six vertical at fifths. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to bottom, #80808033 1px, transparent 1px),
      linear-gradient(to right, #80808033 1px, transparent 1px);
    background-size: 100% 25%, 20% 100%;
    background-position: 0 0, 0 0;
  }

  .screen { display: none; position: relative; z-index: 1; width: min(100%, 1000px); text-align: center; }
  .screen[data-active] { display: block; }
  .screen[data-active] > * { animation: fade-up .85s var(--ease) both; }
  .screen[data-active] > *:nth-child(2) { animation-delay: .08s; }
  .screen[data-active] > *:nth-child(3) { animation-delay: .16s; }
  .screen[data-active] > *:nth-child(4) { animation-delay: .24s; }
  #audit[data-active] {
    position: fixed; inset: 0; z-index: 2; width: auto;
    display: flex; flex-direction: column; text-align: left;
    background: var(--black); animation: fade-in .5s var(--ease) both;
  }
  #audit[data-active] > * { animation: none; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } }

  .mark {
    display: block; width: 84px; height: 96px; fill: var(--primary);
    margin: 0 auto clamp(26px, 4.6vh, 48px);
  }

  /* Integral CF, uppercase, 120% leading. */
  h1 {
    font-family: var(--display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(40px, 7vw, 84px); line-height: 1.1; letter-spacing: 0;
    margin: 0; text-wrap: balance;
  }
  .lede {
    font-family: var(--sora); font-size: clamp(20px, 2.8vw, 30px); line-height: 1.45;
    color: var(--white); max-width: 36ch; margin: 22px auto 0; text-wrap: balance;
  }
  .lede .sentence { display: block; }

  form { display: flex; gap: 16px; align-items: stretch; margin-top: clamp(40px, 7vh, 72px); }
  input {
    flex: 1; min-width: 0; min-height: 104px; font-family: var(--mono); font-size: clamp(30px, 4.6vw, 46px);
    color: var(--white); background: var(--elevated); border: 1px solid var(--border);
    border-radius: 999px; padding: clamp(24px, 3.6vh, 34px) 40px; text-align: center;
  }
  input::placeholder { color: var(--subtle); }
  input:focus { outline: none; border-color: var(--primary); }

  /* The secondary variant the hero CTA uses. */
  button {
    font-family: var(--mono); font-weight: 600; font-style: italic; cursor: pointer;
    background: var(--secondary); color: var(--white); border: 0; border-radius: 0;
    transition: opacity .3s var(--ease), background .3s var(--ease);
  }
  button:hover:not(:disabled) { font-style: normal; }
  button:disabled { background: var(--elevated); color: var(--subtle); cursor: not-allowed; }
  button:active:not(:disabled) { opacity: .8; }
  /* The stand's own keyboard, laid out like Windows' touch keyboard with its
     number row. It opens only when the handle field is tapped, and Windows'
     own keyboard never opens on the visitor screen, so its dictation, emoji
     and settings are never in reach. */
  .kb {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: clamp(16px, 2.4vh, 28px) clamp(12px, 3vw, 40px) clamp(20px, 3vh, 36px);
    transform: translateY(100%); visibility: hidden;
    transition: transform .2s cubic-bezier(.25, 1, .5, 1), visibility 0s linear .2s;
  }
  .kb[data-open] { transform: none; visibility: visible; transition: transform .2s cubic-bezier(.25, 1, .5, 1); }
  .kb-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(8px, 1vh, 12px); }
  .kb-row { display: grid; grid-template-columns: repeat(23, 1fr); gap: clamp(6px, .9vw, 10px); }
  .kb-row.digits { grid-template-columns: repeat(11, 1fr); margin-bottom: clamp(10px, 1.6vh, 18px); }
  .kb button {
    grid-column: span 2; min-height: clamp(64px, 7vh, 88px); padding: 0; border-radius: 12px;
    font-family: var(--mono); font-size: clamp(22px, 3.2vw, 34px); font-weight: 400; font-style: normal;
    background: var(--elevated); color: var(--white); border: 1px solid var(--border);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    transition: transform .08s ease-out, background-color .08s ease-out;
  }
  .kb .digits button { grid-column: auto; min-height: clamp(52px, 5.6vh, 68px); font-size: clamp(20px, 2.6vw, 28px); background: var(--black); color: var(--muted); }
  .kb button:active:not(:disabled) { transform: scale(.96); background: var(--border); opacity: 1; }
  .kb .erase { grid-column: span 3; display: grid; place-items: center; color: var(--muted); }
  .kb .erase svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .kb button:disabled { background: var(--elevated); color: var(--subtle); opacity: .45; }
  .kb .digits button:disabled { background: var(--black); }
  .kb .shift { display: grid; place-items: center; color: var(--muted); }
  .kb .shift svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .kb .shift.on { background: var(--white); color: var(--black); border-color: var(--white); }
  .kb .enter { background: var(--primary); color: var(--black); border-color: var(--primary); font-size: clamp(20px, 2.6vw, 28px); font-weight: 700; }
  .kb .enter:disabled { background: var(--elevated); color: var(--subtle); border-color: var(--border); }
  .kb .enter:active:not(:disabled) { background: var(--primary); }
  .kb .offset-1 { grid-column: 2 / span 2; }
  #entry { transition: transform .2s cubic-bezier(.25, 1, .5, 1); }
  @media (prefers-reduced-motion: reduce) { .kb, .kb[data-open], #entry { transition: none; } }

  #go { min-width: 120px; font-size: clamp(34px, 5vw, 50px); font-style: normal; border-radius: 999px; padding: 0 clamp(30px, 4vw, 44px); }
  .wide { width: 100%; min-height: 96px; font-size: clamp(26px, 3.6vw, 36px); border-radius: 999px; padding: clamp(24px, 3.6vh, 34px); }
  .quiet {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-style: normal; margin-top: 16px;
  }
  .quiet:hover:not(:disabled) { background: transparent; color: var(--white); border-color: var(--border); }

  /* Anchored to the bottom, so new output never moves what is there. */
  /* What the audit is doing and how far along it is, readable from a step
     back: the terminal below is the detail, this is the plot. */
  .audit-head {
    flex: none; padding: clamp(28px, 4vh, 56px) clamp(20px, 3.5vw, 48px) clamp(16px, 2vh, 24px);
    border-bottom: 1px solid var(--border);
  }
  .audit-title {
    margin: 0; font-family: var(--sora); font-weight: 600; line-height: 1.15;
    font-size: clamp(32px, 5vw, 56px); color: var(--white); overflow-wrap: anywhere;
  }
  .audit-title span { color: var(--primary); }
  /* Seven fixed segments and one line of text: nothing changes size as the
     audit moves on, so nothing on screen jumps. */
  .progress {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-top: clamp(18px, 2.4vh, 28px);
  }
  .progress span { height: 8px; background: var(--border); transition: background-color .2s ease-out; }
  .progress span[data-state="done"] { background: var(--primary); }
  .progress span[data-state="active"] { background: var(--white); }
  .progress-text {
    margin: 12px 0 0; font-family: var(--mono); font-size: clamp(18px, 2.2vw, 24px);
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .term {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-start;
    padding: clamp(20px, 2.6vh, 36px) clamp(20px, 3.5vw, 48px) 14px;
    font-family: var(--mono); font-size: clamp(18px, 2.6vw, 28px); line-height: 1.55;
  }
  .term div { animation: appear .35s var(--ease) both; white-space: pre-wrap; overflow-wrap: anywhere; }
  .term .cmd:not(:first-child) { margin-top: .7em; }
  @keyframes appear { from { opacity: 0; } }
  .term::after { content: "\2588"; color: var(--primary); animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .term .dim { color: var(--subtle); }
  .term .cmd { color: var(--white); }
  .term .cmd .user { color: var(--primary); }
  .term .cmd .path { color: var(--secondary); }
  .term .out { color: var(--muted); }
  .term .out b { color: var(--white); font-weight: 400; }
  .term .out i { color: var(--primary); font-style: normal; }
  .term .bar { color: var(--primary); letter-spacing: -.04em; }
  .term .bar u { color: #2a2a30; text-decoration: none; }
  .term .out .k { color: #8884ff; }
  .term .out .s { color: var(--primary); }
  .term .out .n { color: var(--white); }
  .term .out .c { color: var(--subtle); }
  .term .out .h { color: var(--white); }
  .term .say { color: var(--white); white-space: pre-wrap; max-width: 72ch; }

  /* git log --graph, coloured the way git colours its lanes. */
  .term .log { color: var(--white); }
  .term .log .l0 { color: var(--primary); }
  .term .log .l1 { color: var(--secondary); }
  .term .log .l2 { color: var(--muted); }
  .term .log .hash, .term .log .meta { color: var(--subtle); }
  .term .log .late { color: var(--primary); }

  /* A tmux status line, which is what makes a developer read this as real. */
  .tmux {
    display: flex; align-items: center; gap: 1.5ch; flex: none;
    font-family: var(--mono); font-size: clamp(18px, 1.8vw, 24px);
    background: var(--primary); color: var(--black); padding-left: 1ch;
  }
  .tmux .right { margin-left: auto; display: flex; gap: 2ch; }
  .tmux button {
    font-family: var(--mono); font-style: normal; font-weight: 400; font-size: inherit;
    min-height: 72px; background: var(--black); color: var(--primary); padding: 0 4ch;
  }
  .tmux button:hover:not(:disabled) { background: var(--elevated); }

  .caret { color: var(--primary); }

  .verdict { font-family: var(--sora); font-size: clamp(24px, 3.6vw, 38px); line-height: 1.4; margin: 0; }

  .result-handle { font-family: var(--mono); font-size: clamp(20px, 2.6vw, 28px); color: var(--muted); margin: 0; }
  .score { margin: clamp(8px, 1.4vh, 16px) 0 0; font-family: var(--mono); font-weight: 700; line-height: 1; }
  .score .num { color: var(--primary); font-size: clamp(120px, 24vw, 260px); letter-spacing: -.04em; }
  .score .of { color: var(--subtle); font-size: clamp(32px, 5vw, 56px); font-weight: 400; margin-left: .15em; }
  .archetype { margin: clamp(6px, 1vh, 12px) 0 0; font-family: var(--sora); font-size: clamp(22px, 3vw, 32px); font-weight: 700; color: var(--white); }

  /* The receipt's QR, on screen too, for anyone who would rather keep a link
     than a slip of paper. */
  .take {
    display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 2.4vw, 24px);
    margin-top: clamp(28px, 4.5vh, 48px);
  }
  .scan {
    margin: 0; display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 1.6vh, 18px);
    padding: clamp(18px, 2.4vw, 28px); border: 1px solid var(--border); background: var(--surface);
  }
  .scan img { display: block; width: clamp(200px, 28vw, 300px); height: auto; background: #fff; padding: 10px; }
  .scan figcaption { font-family: var(--sora); font-weight: 600; font-size: clamp(20px, 2.6vw, 28px); color: var(--white); }
  .take-actions { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .take-actions .quiet { margin-top: 0; }
  @media (max-width: 700px) { .take { grid-template-columns: 1fr; } }
  .countdown { font-family: var(--mono); font-size: clamp(18px, 2.4vw, 26px); color: var(--muted); margin: 24px 0 0; font-variant-numeric: tabular-nums; }
  .note { font-family: var(--mono); font-size: clamp(17px, 2vw, 22px); color: var(--subtle); margin: 20px 0 0; min-height: 1.3em; }


  /* Hidden menu. A device locked to one app still has to be serviceable, so
     everything an operator would otherwise open Windows for lives here. */
  .admin {
    position: fixed; inset: 0; z-index: 50; background: rgba(7, 7, 7, .92);
    display: grid; place-items: center; padding: clamp(16px, 4vw, 48px);
    text-align: left;
  }
  .admin[hidden] { display: none; }
  .panel {
    width: min(100%, 680px); max-height: 92vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border);
    padding: clamp(20px, 3vw, 32px);
  }
  .panel h2 {
    font-family: var(--display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(26px, 3.6vw, 36px); line-height: 1.2; margin: 0 0 6px;
  }
  .panel h3 {
    font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--primary);
    margin: 30px 0 12px; text-transform: none;
  }
  .panel p { font-family: var(--mono); font-size: 17px; color: var(--muted); margin: 0; }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-family: var(--mono); font-size: 17px; }
  .facts dt { color: var(--subtle); }
  .facts dd { margin: 0; color: var(--white); text-align: right; }
  .facts dd.warn { color: #ff6b6b; }
  .panel p.warn { color: #ff6b6b; margin-top: 12px; }

  #aNewForm { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  #aNewForm[hidden] { display: none; }

  .admin select, .admin input {
    width: 100%; min-height: 64px; font-family: var(--mono); font-size: 19px; color: var(--white);
    background: var(--elevated); border: 1px solid var(--border); border-radius: 0;
    padding: 16px 18px; text-align: left;
  }
  .admin select:focus, .admin input:focus { outline: none; border-color: var(--primary); }

  .acts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
  .acts button, .admin .full {
    font-family: var(--mono); font-size: 18px; font-weight: 600; font-style: normal;
    min-height: 64px; border-radius: 0; padding: 16px 12px; background: var(--elevated); color: var(--white);
    border: 1px solid var(--border);
  }
  .acts button:hover:not(:disabled) { border-color: var(--primary); }
  .acts .danger { color: #ff8585; }
  .acts .danger.armed { background: #ff6b6b; color: var(--black); border-color: #ff6b6b; }
  .admin .full { width: 100%; grid-column: 1 / -1; }
  .admin .go2 { background: var(--primary); color: var(--black); border-color: var(--primary); }

  .nets { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .nets button {
    display: flex; justify-content: space-between; gap: 12px; text-align: left;
    font-family: var(--mono); font-size: 18px; font-weight: 400; font-style: normal;
    background: var(--elevated); color: var(--white); border: 1px solid var(--border);
    min-height: 60px; border-radius: 0; padding: 14px 16px;
  }
  .nets button span:last-child { color: var(--subtle); }

  .pins { display: flex; justify-content: center; gap: 10px; margin: 20px 0 18px; }
  .pins i {
    width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border);
    display: block;
  }
  .pins i.on { background: var(--primary); border-color: var(--primary); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pad button {
    font-family: var(--mono); font-size: 28px; font-weight: 400; font-style: normal;
    background: var(--elevated); color: var(--white); border: 1px solid var(--border);
    min-height: 80px; border-radius: 0; padding: 18px 0;
  }
  .said { font-family: var(--mono); font-size: 17px; color: var(--primary); margin-top: 16px; min-height: 1.4em; }
  .said.bad { color: #ff6b6b; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

  </symbol>
</svg>

<section class="screen" id="entry" data-active>
  <svg class="mark"><use href="#logo"/></svg>
  <h1>{{.Headline}}</h1>
  <p class="lede">{{.Kiosk.Subhead}}</p>
  <form id="form">
    <input id="handle" autocomplete="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="go" inputmode="none" autofocus>
    <button type="submit" id="go" disabled aria-label="Start">&rarr;</button>
  </form>
</section>

<div class="kb" id="kb" role="group" aria-label="Keyboard"><div class="kb-inner" id="kbKeys"></div></div>

<section class="screen" id="audit">
  <header class="audit-head">
    <h2 class="audit-title">Roasting <span id="auditHandle"></span></h2>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="progress-text" id="progressText">Starting</p>
  </header>
  <div class="term" id="term"></div>
  <div class="tmux">
    <span>[roaster] 0:audit*</span>
    <span class="right"><span id="tmuxHandle"></span><span id="tmuxClock"></span></span>
    <button id="cancel">Cancel</button>
  </div>
  
</section>

<section class="screen" id="result">
  <p class="result-handle" id="resultHandle"></p>
  <div class="score"><span class="num" id="score"></span><span class="of">/100</span></div>
  <p class="archetype" id="archetype" hidden></p>
  <p class="verdict" id="finalVerdict" style="margin-top:clamp(24px,4vh,40px)"></p>
  <div class="take">
    <figure class="scan">
      <img id="shareQr" alt="QR code for your full roast" width="220" height="220">
      <figcaption>Scan to keep it</figcaption>
    </figure>
    <div class="take-actions">
      <button class="wide" id="print">Print my receipt</button>
      <button class="wide quiet" id="again">Start over</button>
    </div>
  </div>
  <p class="note" id="note"></p>
  <p class="countdown" id="countdown"></p>
</section>


<div class="admin" id="admin" hidden>
  <div class="panel">
    <h2 id="adminTitle">Enter code</h2>
    <p id="adminHint">Five taps on the mark opened this.</p>
    <div id="adminBody"></div>
    <p class="said" id="said"></p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screens = ['entry', 'audit', 'result'];

  // Set in the hidden menu. Brings the handle rules and the loader's words.
  const pack = {{.Pack}};
  const shareBase = {{.Receipt.ShareBase}};
  const handleRule = new RegExp('[^' + pack.handleChars + ']', 'g');

  // Each sentence of the line under the headline starts its own line, so a
  // break never strands a single word.
  const lede = document.querySelector('#entry .lede');
  const sentences = lede.textContent.trim().split(/(?<=[.!?])\s+/);
  if (sentences.length > 1) {
    lede.textContent = '';
    for (const text of sentences) {
      const part = document.createElement('span');
      part.className = 'sentence';
      part.textContent = text;
      lede.append(part);
    }
  }
  $('handle').placeholder = pack.placeholder;
  $('handle').maxLength = pack.handleMax;

  // Only characters a handle can hold, laid out like Windows' own touch
  // keyboard. Anything the pack allows beyond letters, digits and a hyphen
  // gets a key at the end of the bottom row.
  const shifted = { 1: '!', 2: '@', 3: '#', 4: '$', 5: '%', 6: '^', 7: '&', 8: '*', 9: '(', 0: ')', '-': '_' };

  const kb = {
    el: $('kb'),
    shift: false, // stays on until tapped off

    build() {
      const extras = ['.', '_'].filter(c => c.replace(handleRule, '') === c);
      const row = (cls) => { const r = document.createElement('div'); r.className = 'kb-row ' + cls; $('kbKeys').append(r); return r; };

      const digits = row('digits');
      for (const ch of '1234567890-') digits.append(this.key(ch, ch));

      const top = row('');
      for (const ch of 'qwertyuiop') top.append(this.key(ch, ch));
      const erase = this.key('', null);
      erase.classList.add('erase');
      erase.setAttribute('aria-label', 'Delete');
      erase.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.5L3 12z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5"/></svg>';
      top.append(erase);

      const middle = row('');
      [...'asdfghjkl'].forEach((ch, i) => {
        const b = this.key(ch, ch);
        if (i === 0) b.classList.add('offset-1');
        middle.append(b);
      });

      // Go sits after the last letter and takes the rest of the row.
      const bottom = row('');
      const shift = document.createElement('button');
      shift.type = 'button';
      shift.className = 'shift';
      shift.setAttribute('aria-label', 'Shift');
      shift.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7.5 8H15v7H9v-7H4.5z"/></svg>';
      shift.addEventListener('pointerdown', e => e.preventDefault());
      shift.addEventListener('click', () => this.toggleShift());
      this.shiftKey = shift;
      bottom.append(shift);
      const last = [...'zxcvbnm', ...extras];
      last.forEach(ch => bottom.append(this.key(ch, ch)));
      const enter = this.key('Go', null);
      enter.classList.add('enter');
      enter.id = 'kbGo';
      enter.disabled = true;
      enter.style.gridColumn = `span ${23 - 2 - 2 * last.length}`;
      bottom.append(enter);
      this.relabel();
    },

    key(label, ch) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if (ch) b.dataset.ch = ch;
      // Keeps focus, and the caret, in the field while a key is pressed.
      b.addEventListener('pointerdown', e => e.preventDefault());
      b.addEventListener('click', () => {
        const input = $('handle');
        if (b.classList.contains('enter')) {
          this.close();
          $('form').requestSubmit();
          return;
        }
        input.value = ch ? (input.value + this.out(ch)).slice(0, input.maxLength) : input.value.slice(0, -1);
        input.dispatchEvent(new Event('input'));
      });
      return b;
    },

    out(ch) {
      if (!this.shift) return ch;
      return shifted[ch] ?? ch.toUpperCase();
    },

    toggleShift() { this.setShift(!this.shift); },

    setShift(on) {
      this.shift = on;
      this.shiftKey.classList.toggle('on', on);
      this.shiftKey.setAttribute('aria-pressed', on);
      this.relabel();
    },

    // Keys show what they would type.
    relabel() {
      for (const b of this.el.querySelectorAll('button[data-ch]')) b.textContent = this.out(b.dataset.ch);
    },

    open() {
      if (this.el.hasAttribute('data-open')) return;
      this.el.setAttribute('data-open', '');
      // On a screen too short for both, the entry screen moves up so the field
      // stays visible above the keys.
      requestAnimationFrame(() => {
        const field = $('form').getBoundingClientRect();
        const overlap = field.bottom + 24 - (innerHeight - this.el.offsetHeight);
        $('entry').style.transform = overlap > 0 ? `translateY(${-overlap}px)` : '';
      });
    },

    close() {
      this.el.removeAttribute('data-open');
      $('entry').style.transform = '';
    },
  };
  kb.build();

  // Opens on a tap on the field only: focus alone, as on page load, leaves the
  // screen clear.
  $('handle').addEventListener('pointerdown', () => kb.open());
  document.addEventListener('pointerdown', e => {
    if (!kb.el.contains(e.target) && e.target !== $('handle')) kb.close();
  });
  let current = 'entry', idleTimer = null, roast = null;

  function show(name) {
    if (name !== 'entry') kb.close();
    screens.forEach(s => $(s).toggleAttribute('data-active', s === name));
    current = name;
    if (name === 'entry') $('handle').focus();
    resetIdleTimer();
  }

  // Someone who walks away must not hold the terminal.
  // The result waits two minutes, long enough to read, print and scan, and
  // says so. Once the receipt is out, one minute is enough to scan the code.
  const twoMinutes = 2 * 60 * 1000;
  let resultWait = twoMinutes, deadline = 0;

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (current === 'entry' && !$('handle').value) return;
    const wait = current === 'result' ? resultWait : 45000;
    deadline = Date.now() + wait;
    idleTimer = setTimeout(reset, wait);
  }

  setInterval(() => {
    if (current !== 'result') return;
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $('countdown').textContent = `Back to the start in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  }, 250);
  function reset() {
    if (stream) { stream.close(); stream = null; }
    feed.stop();
    $('handle').value = '';
    $('go').disabled = $('kbGo').disabled = true;
    kb.close();
    kb.setShift(false);
    $('term').innerHTML = '';
    $('note').textContent = '';
    show('entry');
  }
  ['pointerdown', 'keydown'].forEach(e => document.addEventListener(e, resetIdleTimer));
  // Ctrl and the wheel, or a trackpad pinch, zoom the page. The WebView is told
  // the same, but a stand should not rely on one switch.
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(e => document.addEventListener(e, ev => ev.preventDefault()));

  // Only what a GitHub username can hold.
  $('again').addEventListener('click', reset);
  $('cancel').addEventListener('click', reset);

  // Anything can be typed; a name the platform cannot have is refused by the
  // lookup, in words. A pasted profile link or an @ keeps only the name.
  $('handle').addEventListener('input', e => {
    let v = e.target.value.replace(/\s+/g, '');
    const link = v.match(/github\.com\/([^/?#]+)/i);
    if (link) v = link[1];
    v = v.replace(/^@/, '');
    e.target.value = v;
    $('go').disabled = $('kbGo').disabled = v.length === 0;
  });

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const typed = $('handle').value.trim();
    if (!typed) return;

    // A run of digits is never a handle anyone means to roast, so it is worth
    // one request to see whether it is the code. Anything else goes straight
    // to the audit with no round trip.
    if (/^\d{4,8}$/.test(typed) && await unlock(typed)) {
      $('handle').value = '';
      $('go').disabled = true;
      return;
    }
    start(typed);
  });

  // Each update paints as it lands, so the wait shows real progress.
  let stream = null;
  let verdictIn = false;

  function start(handle) {
    $('term').innerHTML = '';
    feed.stop();
    feed.who = handle;
    verdictIn = false;
    show('audit');
    session(handle);
    line('cmd', './roast ' + handle);

    const src = new EventSource('/api/roast?handle=' + encodeURIComponent(handle)
      + location.search.replace('?', '&'));
    stream = src;

    src.onmessage = e => {
      const u = JSON.parse(e.data);
      if (u.phase === 'fetch') { stage('profile'); line('dim', 'querying api.github.com/graphql...'); }
      if (u.phase === 'section') feed.section(u.section);
      if (u.phase === 'feed') feed.log(u.feed);
      if (u.phase === 'metric') {
        if (!feed.measuring) {
          feed.measuring = true;
          const cmd = `./roast gauges ${feed.who}`;
          feed.push(() => { stage('gauges'); line('cmd', cmd); }, typingTime(cmd));
        }
        feed.push(() => measured(u.metric), 300);
      }
      // The reading always plays to the end, however fast the verdict comes
      // back: it is half the fun. The verdict is typed last, and the result
      // screen follows once it has been read.
      if (u.phase === 'verdict' && !u.verdict) feed.push(() => { stage('verdict'); if (!verdictIn) line('dim', 'waiting for the verdict...'); }, 0);
      if (u.phase === 'verdict' && u.verdict) {
        verdictIn = true;
        feed.push(() => { stage('verdict'); typeVerdict(u.verdict); }, typingTime('cat verdict.txt') + 14 * u.verdict.length + 1500);
      }
      if (u.phase === 'done') { roast = u.roast; src.close(); feed.push(() => stream === src && finish(), 0); }
      if (u.phase === 'error') fail(src, u.error);
      resetIdleTimer();
    };
    src.onerror = () => fail(src, 'could not reach the audit');
  }

  // Fills the progress bar to the step the terminal has reached, and names it.
  const stepOrder = ['profile', 'readme', 'repos', 'year', 'commits', 'gauges', 'verdict'];
  const stepText = {
    profile: 'Reading the profile', readme: 'Reading the README', repos: 'Going through the repos',
    year: 'Counting contributions', commits: 'Reading commits', gauges: 'Measuring the damage',
    verdict: 'Writing the verdict',
  };
  function stage(name) {
    const at = stepOrder.indexOf(name);
    [...$('progress').children].forEach((seg, i) => {
      seg.dataset.state = at < 0 ? '' : i < at ? 'done' : i === at ? 'active' : '';
    });
    $('progress').setAttribute('aria-valuenow', String(Math.max(at, 0)));
    $('progressText').textContent = at < 0 ? 'Starting' : `${stepText[name]}, step ${at + 1} of ${stepOrder.length}`;
  }

  function session(handle) {
    const now = new Date();
    line('dim', 'Last login: ' + now.toDateString().slice(0, 10) + ' '
      + now.toTimeString().slice(0, 8) + ' on ttys001');
    $('tmuxHandle').textContent = $('auditHandle').textContent = '@' + handle;
    stage(null);
    $('tmuxClock').textContent = now.toTimeString().slice(0, 5);
  }

  const prompt = '<span class="user">upgaming@roaster</span>:<span class="path">~</span>$ ';

  // Whatever no longer fits scrolls off the top, however tall the screen is.
  // Milliseconds per character a command is typed at, and how long one takes.
  const typing = 8;
  const typingTime = cmd => typing * cmd.length + 150;

  // Output coloured the way jq and a shell colour it: JSON keys, strings and
  // numbers apart, and # comments dimmed.
  function colour(text) {
    if (text.startsWith('#')) return `<span class="c">${esc(text)}</span>`;
    const kv = text.match(/^(\s*)"([^"]+)": (.*?)(,?)$/);
    if (kv) {
      const [, pad, key, value, comma] = kv;
      const cls = value.startsWith('"') ? 's' : value === 'null' ? 'c' : 'n';
      return `${pad}<span class="k">"${esc(key)}"</span>: <span class="${cls}">${esc(value)}</span>${comma}`;
    }
    if (/^(NAME|Showing)\b/.test(text)) return `<span class="h">${esc(text)}</span>`;
    return esc(text);
  }

  function line(cls, text) {
    const el = document.createElement('div');
    el.className = cls;
    const term = $('term');
    term.append(el);
    if (cls === 'cmd') {
      el.innerHTML = prompt;
      const typed = document.createTextNode('');
      el.append(typed);
      let i = 0;
      const key = () => { typed.data = text.slice(0, ++i); if (i < text.length) setTimeout(key, typing); };
      key();
    } else if (cls === 'out') {
      el.innerHTML = colour(text);
    } else {
      el.textContent = text;
    }
    while (term.scrollHeight > term.clientHeight && term.children.length > 1) term.firstElementChild.remove();
    return el;
  }

  // The same block glyphs the receipt prints, so the screen previews the paper.
  const cells = 38;

  function measured(m) {
    if (m.percent == null) {
      const el = line('out', '');
      el.innerHTML = esc(m.label.toLowerCase()) + '  <b>' + esc(m.value) + '</b>';
      return;
    }
    const el = line('out', '');
    el.innerHTML = esc(m.label.toLowerCase()) + '  <b>' + esc(m.value) + '</b>'
      + (m.tag ? '  <i>' + esc(m.tag) + '</i>' : '');

    const bar = line('bar', '');
    const filled = Math.round((m.percent / 100) * cells);
    // Drawn a cell at a time so the bar grows rather than appearing.
    let n = 0;
    const grow = () => {
      bar.innerHTML = '\u2588'.repeat(n) + '<u>' + '\u2591'.repeat(cells - n) + '</u>';
      if (n++ < filled) setTimeout(grow, 18);
    };
    grow();
  }

  // Everything the audit sends plays in the order it arrives, a line at a
  // time, so the screen reads the account top to bottom: who they are, their
  // README, their repos, their year, their commits, the gauges, the verdict.
  const feed = {
    steps: [], timer: null, lanes: new Map(), who: '', sections: 0,
    line: 150, commit: 180, commits: 8,

    push(step, pause) {
      this.steps.push({ step, pause });
      if (!this.timer) this.next();
    },

    next() {
      const s = this.steps.shift();
      if (!s) { this.timer = null; return; }
      s.step();
      this.timer = setTimeout(() => this.next(), s.pause);
    },

    stop() { clearTimeout(this.timer); this.timer = null; this.steps = []; this.lanes.clear(); this.sections = 0; this.measuring = false; },

    // A command is typed, so it waits for its own typing before the output.
    section(sec) {
      const step = ['profile', 'readme', 'repos', 'year'][this.sections++];
      this.push(() => { if (step) stage(step); line('cmd', sec.cmd); }, typingTime(sec.cmd));
      for (const text of sec.lines || []) this.push(() => line('out', text), this.line);
    },

    // An account with nothing public gets the pack's quiet bit instead of a log.
    log(items) {
      this.push(() => stage('commits'), 0);
      if (!items || !items.length) {
        for (const [kind, text] of pack.quiet) {
          this.push(() => line(kind, text.replace('{handle}', this.who)), kind === 'cmd' ? typingTime(text) : 600);
        }
        return;
      }
      this.push(() => line('cmd', pack.feed), typingTime(pack.feed));
      for (const c of items.slice(0, this.commits)) this.push(() => this.draw(c), this.commit);
    },

    // Three lanes at most, one per repository, so the feed reads as branches.
    draw(c) {
      if (!this.lanes.has(c.where)) this.lanes.set(c.where, this.lanes.size % 3);
      const lane = this.lanes.get(c.where);
      const width = Math.min(this.lanes.size, 3);
      let graph = '';
      for (let i = 0; i < width; i++) {
        graph += `<span class="l${i}">${i === lane ? '*' : '|'}</span> `;
      }
      // Sliced from the timestamp as written: the author's clock, not the stand's.
      const day = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(c.at.slice(0, 10) + 'T00:00:00Z').getUTCDay()];
      const time = c.at.slice(11, 16);
      const late = Number(time.slice(0, 2)) < 6;
      const msg = c.text.length > 38 ? c.text.slice(0, 37) + '.' : c.text;
      const el = line('log', '');
      el.innerHTML = graph
        + (c.ref ? `<span class="hash">${esc(c.ref)}</span> ` : '')
        + esc(msg || '(no message)')
        + `  <span class="meta">${esc(c.where)}, ${day} </span><span class="${late ? 'late' : 'meta'}">${time}</span>`;
    },
  };

  function typeVerdict(text) {
    line('cmd', 'cat verdict.txt');
    const el = line('say', '');
    let i = 0;
    const tick = () => {
      el.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(tick, 14);
    };
    tick();
  }

  // Says why in the terminal, then hands the stand to the next person.
  function fail(src, message) {
    src.close();
    feed.stop();
    line('out', message);
    line('dim', 'back to the start in a few seconds...');
    setTimeout(() => stream === src && reset(), 6000);
  }

  function finish() {
    const url = shareBase.replace(/\/$/, '') + '/' + roast.code;
    $('resultHandle').textContent = '@' + roast.handle;
    $('score').textContent = String(roast.score).split('/')[0].trim();
    $('archetype').textContent = roast.archetype || '';
    $('archetype').hidden = !roast.archetype;
    $('finalVerdict').textContent = '“' + roast.verdict + '”';
    $('shareQr').src = '/qr?m=8&d=' + encodeURIComponent(url);
    $('print').disabled = false;
    $('print').textContent = 'Print my receipt';
    $('again').textContent = 'Start over';
    $('note').textContent = '';
    resultWait = twoMinutes;
    show('result');
  }

  // Web Serial is what lets the kiosk be a hosted URL with nothing installed.
  // The Windows app has no such thing, and prints through the server instead,
  // so everything it offers is behind this.
  const hasSerial = 'serial' in navigator;
  const serial = {
    port: null,
    async restore() {
      if (!hasSerial) return;
      const [granted] = await navigator.serial.getPorts();
      if (!granted) return;
      await granted.open({ baudRate: 115200 });
      this.port = granted;
    },
    async connect() {
      if (!hasSerial) throw new Error('This browser has no Web Serial.');
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      this.port = port;
    },
    async write(bytes) {
      if (!this.port) throw new Error('Connect the printer first.');
      const writer = this.port.writable.getWriter();
      try {
        for (let i = 0; i < bytes.length; i += 64) await writer.write(bytes.subarray(i, i + 64));
      } finally { writer.releaseLock(); }
    },
  };
  serial.restore().catch(() => {});

  $('print').addEventListener('click', async e => {
    e.target.disabled = true;
    e.target.textContent = 'Printing';
    try {
      if (serial.port) {
        const res = await fetch('/receipt.bin?code=' + roast.code + location.search.replace('?', '&'));
        await serial.write(new Uint8Array(await res.arrayBuffer()));
      } else {
        const res = await fetch('/receipt/print', {
          method: 'POST',
          body: new URLSearchParams({ code: roast.code }),
        });
        if (!res.ok) throw new Error(await res.text());
      }
      e.target.textContent = 'Take your receipt';
      $('note').textContent = 'Scan the code for the digital version.';
      $('again').textContent = 'Done';
      resultWait = 60 * 1000;
      resetIdleTimer();
    } catch (err) {
      e.target.disabled = false;
      e.target.textContent = 'Try again';
      $('note').textContent = err.message || String(err);
    }
  });


  // ---- Hidden menu ------------------------------------------------------
  // Five taps on the mark, then a code. Two gates, because a curious visitor
  // will find one of them.
  const admin = {
    pin: '', code: '', taps: [], attempts: 0, lockedUntil: 0,
    el: $('admin'), title: $('adminTitle'), hint: $('adminHint'),
    body: $('adminBody'), said: $('said'),
  };

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const say = (msg, bad) => { admin.said.textContent = msg; admin.said.classList.toggle('bad', !!bad); };

  document.querySelectorAll('.mark').forEach(mark => {
    mark.style.cursor = 'default';
    mark.addEventListener('click', () => {
      const now = Date.now();
      admin.taps = admin.taps.filter(t => now - t < 3000).concat(now);
      if (admin.taps.length >= 5) { admin.taps = []; openAdmin(); }
    });
  });

  function openAdmin() {
    if (Date.now() < admin.lockedUntil) {
      return;
    }
    admin.pin = '';
    admin.el.hidden = false;
    clearTimeout(idleTimer);
    renderPad();
  }

  function closeAdmin() {
    admin.el.hidden = true;
    admin.code = '';
    say('');
    resetIdleTimer();
  }

  function renderPad() {
    admin.title.textContent = 'Enter code';
    admin.hint.textContent = 'Five taps on the mark opened this.';
    const dots = [0, 1, 2, 3].map(i => `<i class="${i < admin.pin.length ? 'on' : ''}"></i>`).join('');
    const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, 'close', 0, 'del']
      .map(k => `<button data-k="${k}">${k === 'del' ? '&larr;' : k === 'close' ? '&times;' : k}</button>`).join('');
    admin.body.innerHTML = `<div class="pins">${dots}</div><div class="pad">${keys}</div>`;

    admin.body.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k;
      if (k === 'close') return closeAdmin();
      if (k === 'del') { admin.pin = admin.pin.slice(0, -1); return renderPad(); }
      if (admin.pin.length >= 8) return;
      admin.pin += k;
      renderPad();
      if (admin.pin.length === 4) verify();
    }));
  }

  // unlock opens the menu if the code is right. Both ways in go through here:
  // typing it into the username field, and the five tap keypad.
  async function unlock(code) {
    if (Date.now() < admin.lockedUntil) return false;
    let res;
    try {
      res = await fetch('/admin/state', { headers: { 'X-Admin-Pin': code } });
    } catch {
      return false;
    }
    if (!res.ok) {
      // Five wrong codes and the menu goes quiet for a minute. Nobody at a
      // booth is guessing a fourth digit patiently.
      if (++admin.attempts >= 5) {
        admin.lockedUntil = Date.now() + 60000;
        admin.attempts = 0;
      }
      return false;
    }
    admin.attempts = 0;
    admin.code = code;
    admin.el.hidden = false;
    clearTimeout(idleTimer);
    renderMenu(await res.json());
    say('');
    return true;
  }

  async function verify() {
    say('Checking...');
    const code = admin.pin;
    if (await unlock(code)) return;
    admin.pin = '';
    if (admin.el.hidden) return;
    renderPad();
    say(Date.now() < admin.lockedUntil ? 'Too many tries.' : 'Wrong code.', true);
  }

  const call = async (path, body) => {
    const res = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'X-Admin-Pin': admin.code },
      body,
    });
    const text = await res.text();
    if (!res.ok) throw new Error(text || res.statusText);
    return text;
  };

  async function refresh() {
    try { renderMenu(JSON.parse(await call('/admin/state'))); }
    catch (err) { say(err.message, true); }
  }

  function renderMenu(s) {
    admin.title.textContent = 'Terminal ' + s.terminal;
    admin.hint.textContent = s.event;

    const mins = Math.floor(s.uptimeSeconds / 60);
    const wifi = s.wifi && s.wifi.connected
      ? `${esc(s.wifi.ssid)} ${s.wifi.signal}%`
      : 'not connected';
    const serialState = serial.port ? 'connected in browser' : (s.printer ? esc(s.printer) : 'none selected');

    admin.body.innerHTML = `
      <dl class="facts">
        <dt>Printer</dt><dd class="${serial.port || s.printer ? '' : 'warn'}">${serialState}</dd>
        <dt>Wi-Fi</dt><dd class="${s.wifi && s.wifi.connected ? '' : 'warn'}">${wifi}</dd>
        <dt>Roasts</dt><dd>${s.printed}</dd>
        <dt>Running</dt><dd>${mins} min</dd>
        <dt>Roasts from</dt><dd>${s.provider === 'remote' ? 'live service' : 'demo data'}</dd>
        <dt>Version</dt><dd>${esc(s.version)}</dd>
        ${s.lastError ? `<dt>Last error</dt><dd class="warn">${esc(s.lastError)}</dd>` : ''}
      </dl>
      ${(s.problems || []).map(p => `<p class="warn">${esc(p)}</p>`).join('')}

      <h3>Printer</h3>
      <select id="aPrinter">
        ${hasSerial ? '<option value="browser">This browser, over Web Serial</option>' : ''}
        <option value="">None</option>
        ${(s.printers || []).map(p => `<option value="${esc(p.spec)}"${p.spec === s.printer ? ' selected' : ''}>${esc(p.label)}</option>`).join('')}
      </select>
      <select id="aColumns">
        ${[[48, '80 mm paper, 48 characters a line (most printers)'], [42, '80 mm paper, 42 characters a line (narrow head)'], [32, '58 mm paper, 32 characters a line']]
          .map(([n, label]) => `<option value="${n}"${n === s.columns ? ' selected' : ''}>${label}</option>`).join('')}
      </select>
      <div class="acts">
        ${hasSerial ? '<button id="aConnect">Connect printer</button>' : ''}
        <button id="aTest">Test slip</button>
        <button id="aReprint" class="full"${s.canReprint ? '' : ' disabled'}>Reprint the last receipt</button>
      </div>

      <h3>Wi-Fi</h3>
      <div class="acts"><button id="aScan" class="full">Scan for networks</button></div>
      <div class="nets" id="aNets"></div>

      <h3>Event</h3>
      <select id="aEvent">
        ${(s.events || []).map(e => `<option value="${esc(e.code)}"${e.code === s.event ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}
      </select>

      <div class="acts">
        <button id="aNewEvent" class="full">Add an event</button>
      </div>
      <div id="aNewForm" hidden>
        <input id="aName" placeholder="Berlin JS Conf 2026" maxlength="48">
        <input id="aTitle" placeholder="Receipt headline, 21 characters" maxlength="21">
        <input id="aStub" placeholder="Hiring line on the stub" maxlength="42">
        <div class="acts">
          <button id="aCreate" class="go2">Create and switch</button>
          <button id="aCancel">Cancel</button>
        </div>
      </div>

      <h3>Roasting</h3>
      <select id="aPack">
        ${(s.packs || []).map(p => `<option value="${esc(p.key)}"${p.key === s.pack ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select>

      <h3>Roast service</h3>
      <select id="aSource">
        <option value="demo"${s.provider === 'remote' ? '' : ' selected'}>Demo, rehearsal data</option>
        <option value="remote"${s.provider === 'remote' ? ' selected' : ''}>Live roast service</option>
      </select>
      <input id="aRemote" value="${esc(s.remoteUrl)}" placeholder="https://roast.example.com/roast" inputmode="url" autocomplete="off">
      <input id="aToken" type="password" autocomplete="off"
             placeholder="${s.tokenSet ? 'Token stored. Paste a new one to replace it' : 'Paste the terminal token'}">
      <div class="acts"><button id="aCheck" class="full">Test the connection</button></div>

      <h3>Terminal number</h3>
      <input id="aTerminal" value="${esc(s.terminal)}" maxlength="6" inputmode="numeric">

      <h3>Menu code</h3>
      <input id="aPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="New code, 4 to 8 digits">

      <h3>Software</h3>
      <div class="acts"><button id="aUpdate" class="full">Check for updates</button></div>

      <h3>Power</h3>
      <div class="acts">
        <button id="aRestart">Restart app</button>
        <button id="aQuit" class="danger">Exit kiosk</button>
        <button id="aReboot" class="danger">Reboot device</button>
        <button id="aOff" class="danger">Shut down</button>
        <button id="aSignOut" class="danger full">Sign out to Windows</button>
        <button id="aClose" class="full go2">Back to the kiosk</button>
      </div>`;

    on('aClose', closeAdmin);

    on('aPrinter', async e => {
      if (e.target.value === 'browser') return say('Press Connect printer.');
      try { say(await call('/printer', new URLSearchParams({ spec: e.target.value }))); }
      catch (err) { say(err.message, true); }
    }, 'change');

    on('aConnect', async () => {
      try { await serial.connect(); say('Printer connected in this browser.'); }
      catch (err) { say(err.message || 'No printer chosen.', true); }
    });

    on('aTest', () => act(async () => {
      if (serial.port) { await printBytes('/test.bin'); return 'Test slip sent from this browser.'; }
      return await call('/print/test', new URLSearchParams());
    }));

    on('aReprint', () => act(async () => {
      if (serial.port) { await printBytes('/receipt.bin?code=' + encodeURIComponent(lastCode())); return 'Reprinted from this browser.'; }
      return await call('/admin/reprint', new URLSearchParams());
    }));

    on('aScan', () => act(async () => {
      say('Scanning...');
      const nets = JSON.parse(await call('/admin/wifi/scan'));
      renderNetworks(nets);
      return nets.length ? `${nets.length} networks.` : 'No networks in range.';
    }));

    on('aEvent', async e => {
      try {
        say(await call('/event', new URLSearchParams({ code: e.target.value })));
        setTimeout(() => location.search = '?event=' + encodeURIComponent(e.target.value), 600);
      } catch (err) { say(err.message, true); }
    }, 'change');

    on('aNewEvent', () => {
      const form = $('aNewForm');
      form.hidden = !form.hidden;
      if (!form.hidden) $('aName').focus();
    });
    on('aCancel', () => { $('aNewForm').hidden = true; say(''); });

    on('aCreate', () => act(async () => {
      const name = $('aName').value.trim();
      if (!name) throw new Error('The event needs a name.');
      const body = new URLSearchParams({
        name,
        title: $('aTitle').value.trim(),
        stub: $('aStub').value.trim(),
        from: s.event,
      });
      const msg = await call('/events', body);
      const code = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      await call('/event', new URLSearchParams({ code }));
      setTimeout(() => location.search = '?event=' + encodeURIComponent(code), 700);
      return msg;
    }));

    // The page is drawn for one pack, so a change reloads it.
    on('aPack', async e => {
      try {
        say(await call('/admin/settings', new URLSearchParams({ pack: e.target.value })));
        setTimeout(() => location.reload(), 600);
      } catch (err) { say(err.message, true); }
    }, 'change');

    // Each field saves on its own, then the menu redraws from what was saved.
    const save = (fields, done) => act(async () => {
      const msg = await call('/admin/settings', new URLSearchParams(fields));
      if (done) done();
      await refresh();
      return msg;
    });
    on('aSource', e => save({ provider: e.target.value }), 'change');
    on('aColumns', e => save({ columns: e.target.value }, () => say('Saved. Print a test slip to check the edges.')), 'change');
    on('aRemote', e => save({ remoteUrl: e.target.value.trim() }), 'change');
    on('aToken', e => e.target.value.trim() && save({ token: e.target.value.trim() }), 'change');
    on('aCheck', () => act(async () => { say('Checking...'); return await call('/admin/service'); }));
    on('aPin', e => {
      const pin = e.target.value.trim();
      if (pin) save({ adminPin: pin }, () => { admin.code = pin; });
    }, 'change');

    on('aTerminal', e => act(async () =>
      await call('/admin/settings', new URLSearchParams({ terminal: e.target.value.trim() || '001' }))), 'change');

    // First tap checks; once a release is offered, the same button installs it.
    let offer = null;
    on('aUpdate', async () => {
      const b = $('aUpdate');
      if (!offer) {
        try {
          const info = JSON.parse(await call('/admin/update'));
          if (info.available) {
            offer = info;
            b.textContent = 'Install ' + info.latest;
            say(`${info.latest} is out. This is ${info.current}.`);
          } else {
            say(`Up to date on ${info.current}.`);
          }
        } catch (err) { say(err.message || String(err), true); }
        return;
      }
      b.disabled = true;
      say('Installing. The stand is down for up to a minute.');
      try {
        say(await call('/admin/update', new URLSearchParams()));
        setTimeout(() => location.reload(), 8000);
      } catch (err) {
        b.disabled = false;
        say(err.message || String(err), true);
      }
    });

    on('aRestart', () => act(async () => {
      const msg = await call('/admin/restart', new URLSearchParams());
      setTimeout(() => location.reload(), 4000);
      return msg;
    }));

    confirmed('aQuit', [
      'Exit the kiosk and leave the stand unattended?',
      'The screen will drop to Windows. Confirm.',
    ], () => call('/admin/quit', new URLSearchParams()));

    confirmed('aReboot', [
      'Reboot the device?',
      'The stand is down for about a minute. Confirm.',
    ], () => call('/admin/reboot', new URLSearchParams()));

    confirmed('aOff', [
      'Shut the device down?',
      'Someone has to press the power button to bring it back. Confirm.',
    ], () => call('/admin/shutdown', new URLSearchParams()));

    confirmed('aSignOut', [
      'Sign out to the Windows sign-in screen?',
      'Sign in as an administrator within 2 minutes, or the stand comes back. Confirm.',
    ], () => call('/admin/signout', new URLSearchParams()));
  }

  function renderNetworks(nets) {
    const box = $('aNets');
    if (!box) return;
    box.innerHTML = nets.map((n, i) =>
      `<button data-i="${i}"><span>${esc(n.ssid)}${n.saved ? ' &check;' : ''}</span><span>${n.signal}%${n.secure ? ' &#128274;' : ''}</span></button>`
    ).join('');
    box.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => {
      const n = nets[Number(b.dataset.i)];
      // A saved network needs no password; a new secured one does.
      const pass = n.secure && !n.saved ? prompt('Password for ' + n.ssid) : '';
      if (pass === null) return;
      act(async () => await call('/admin/wifi/connect', new URLSearchParams({ ssid: n.ssid, password: pass || '' })));
    }));
  }

  // Anything that ends the event asks twice, and forgets after five seconds of
  // hesitation. One stray tap on a touchscreen must never reboot the stand.
  function confirmed(id, prompts, run) {
    const b = $(id);
    if (!b) return;
    const label = b.textContent;
    let step = 0, timer = null;

    const reset = () => {
      clearTimeout(timer);
      step = 0;
      b.textContent = label;
      b.classList.remove('armed');
      say('');
    };

    b.addEventListener('click', () => {
      clearTimeout(timer);
      if (step < prompts.length) {
        say(prompts[step], true);
        b.textContent = step === prompts.length - 1 ? 'Confirm' : 'Tap again';
        b.classList.add('armed');
        step++;
        timer = setTimeout(reset, 5000);
        return;
      }
      reset();
      act(run);
    });
  }

  async function act(run) {
    try {
      const msg = await run();
      if (msg) say(msg);
    } catch (err) {
      say(err.message || String(err), true);
    }
  }

  function on(id, fn, ev) {
    const el = $(id);
    if (el) el.addEventListener(ev || 'click', fn);
  }

  function lastCode() { return roast ? roast.code : ''; }

  async function printBytes(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(await res.text());
    await serial.write(new Uint8Array(await res.arrayBuffer()));
  }

  // Third level of supervision: the page is up but the server behind it went
  // away. Three misses is about 45 seconds, enough to ride out a restart.
  let misses = 0;
  setInterval(async () => {
    try {
      const res = await fetch('/health', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      misses = 0;
    } catch {
      if (++misses >= 3) location.reload();
    }
  }, 15000);

  // A script error must not leave a dead screen in front of a queue.
  window.addEventListener('error', () => setTimeout(() => location.reload(), 5000));
  window.addEventListener('unhandledrejection', e => e.preventDefault());

  // ?screen=audit or ?screen=result jumps straight to a state, for reviewing
  // the design without running an audit.
  const preview = new URLSearchParams(location.search).get('screen');
  if (preview === 'audit' || preview === 'result') {
    fetch('/api/example' + location.search).then(r => r.json()).then(r => {
      roast = r;
      if (preview === 'result') return finish();
      show('audit');
      session(r.handle);
      line('cmd', './roast ' + r.handle);
      r.metrics.forEach(measured);
      typeVerdict(r.verdict);
    });
  } else {
    show('entry');
  }
})();
</script>
</body>
</html>
